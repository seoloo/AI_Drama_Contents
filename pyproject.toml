[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-drama-studio"
version = "0.1.0"
description = "AI 숏폼 드라마 제작 + 인스타그램 반자동 업로드 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1",
    "requests>=2.31",
    "pillow>=10",
    "google-genai>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 시스템에 ffmpeg 를 설치하지 않고 pip 로 받은 ffmpeg 바이너리를 쓰고 싶을 때
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
