  with pale pink insides, two tiny rounded tan horns, huge sparkly emerald-green eyes, a tiny pink nose,
  a cheeky smile with two little fangs, small orange bat-like wings, little orange paws with tiny claws,
  and a long, very fluffy orange fox tail whose tip softly turns into a warm flickering flame,
  slightly larger than his sister
