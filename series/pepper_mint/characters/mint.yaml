# 디자인: 5차 시안 2번 + 1번 색 (편집 결과 2, 2026-11-13 확정) - Pepper 와 같은 모델의 흰 털 얼음 용
id: mint
name: Mint
role: 여동생, 얼음 용
age: 아기 (오빠보다 조금 작음)
personality: >
  차분하고 호기심이 많지만 조금 수줍다. 오빠를 제일 좋아한다.
  기쁘면 주변에 작은 눈송이가 날리고, 속상하면 발밑이 살짝 얼어붙는다.
appearance: >
  Mint: Pepper's little sister, built on the same character model as her brother - a chubby four-legged baby ice
  dragon girl with a big round head on a small round body, covered in dense soft fluffy snow-white fur with a fluffy
  white chest ruff, big pointed fox-like ears with pale icy-blue insides, a small row of rounded pale icy-blue horns
  on her head, big round deep sapphire-blue eyes with visible whites and long lashes, a tiny pink nose, a sweet
  closed-mouth smile, small pale icy-blue bat-like wings with soft rounded edges, little white paws, and a long fluffy
  white tail ending in a pale icy-blue snowflake-shaped ice-crystal tip, slightly smaller and rounder than her brother
voice:
  elevenlabs_voice_id: ""
