# 시리즈 바이블 - 사람이 직접 쓰고 고치는 "원작" 설정입니다.
# 대본 생성 AI 는 매 회차 이 내용을 읽고 세계관과 톤을 지킵니다.
id: sample
title: 열두 시의 편의점
genre: 미스터리 로맨스
logline: >
  새벽 편의점 야간 알바생이 매일 밤 12시에 같은 컵라면을 사 가는 손님의 비밀을 알게 된다.
world: >
  서울 변두리의 24시간 편의점. 비 오는 밤이 많고, 형광등 불빛과 네온사인이 대비된다.
tone: 잔잔하지만 매 회 마지막에 궁금증을 남기는 결말. 과한 폭력이나 선정성 없음.
visual_style: >
  cinematic Korean webtoon illustration, soft rim lighting, rainy night,
  neon reflections, muted teal and warm orange palette, vertical 9:16 composition
narration_style: 1인칭 독백. 짧고 담담한 문장.

format: image_narration     # image_narration(1단계) | anime(2단계) | live_action(3단계)
target_duration_sec: 60

narrator:
  name: 내레이터
  elevenlabs_voice_id: ""   # ElevenLabs 보이스 ID

# 실사풍 AI 인물이 나오면 true -> 인스타 "AI 생성" 라벨/고지 체크를 강제합니다.
ai_generated_realistic_people: false
